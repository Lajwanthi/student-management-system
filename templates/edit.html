<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card p-4 shadow">
        <h3 class="text-center mb-4">Edit Student</h3>

        <form method="POST">
            <input type="text" name="student_id" value="{{ student.student_id }}" class="form-control mb-3" required>
            <input type="text" name="name" value="{{ student.name }}" class="form-control mb-3" required>
            <input type="text" name="course" value="{{ student.course }}" class="form-control mb-3" required>
            <input type="number" name="marks" value="{{ student.marks }}" class="form-control mb-3" required>

            <button type="submit" class="btn btn-success">Update</button>
            <a href="/dashboard" class="btn btn-secondary">Back</a>
        </form>
    </div>
</div>

</body>
</html>
