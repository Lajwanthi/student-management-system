<!DOCTYPE html>
<html>
<head>
    <title>Add Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card p-4 shadow">
        <h3 class="text-center mb-4">Add Student</h3>

        <form method="POST">
            <input type="text" name="student_id" class="form-control mb-3" placeholder="Student ID" required>
            <input type="text" name="name" class="form-control mb-3" placeholder="Name" required>
            <input type="text" name="course" class="form-control mb-3" placeholder="Course" required>
            <input type="number" name="marks" class="form-control mb-3" placeholder="Marks" required>

            <button type="submit" class="btn btn-primary">Add</button>
            <a href="/dashboard" class="btn btn-secondary">Back</a>
        </form>
    </div>
</div>

</body>
</html>
